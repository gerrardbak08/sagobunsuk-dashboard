<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #111110; }

  .bg {
    position: absolute; inset: 0;
    background: #111110;
  }
  /* 좌측 진홍 사이드바 */
  .bg::before {
    content: '';
    position: absolute;
    left: 0; top: 0;
    width: 6px; height: 100%;
    background: #D70011;
  }
  /* 우하단 노이즈 오버레이 */
  .bg::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 80% 110%, rgba(215,0,17,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 400px 300px at 10% -10%, rgba(255,255,255,0.03) 0%, transparent 60%);
  }

  /* 그리드 라인 */
  .grid-lines {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .container {
    position: relative; z-index: 1;
    width: 1200px; height: 630px;
    display: grid;
    grid-template-columns: 1fr 340px;
    padding: 0;
  }

  /* 좌측 메인 */
  .left {
    padding: 52px 56px 48px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
    border-right: 1px solid rgba(255,255,255,0.07);
  }

  .top-meta {
    display: flex; align-items: center; gap: 12px;
  }
  .badge-red {
    background: #D70011;
    padding: 4px 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 10px; font-weight: 700;
    color: #fff; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .badge-version {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: rgba(255,255,255,0.3);
    letter-spacing: 0.5px;
  }
  .date-meta {
    margin-left: auto;
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: rgba(255,255,255,0.25);
  }

  .main-title {
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 900;
    font-size: 52px;
    color: #fff;
    line-height: 1.15;
    letter-spacing: -2px;
  }
  .main-title .accent { color: #D70011; }
  .subtitle {
    margin-top: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px; color: rgba(255,255,255,0.4);
    line-height: 1.6; font-weight: 400;
  }
  .subtitle strong { color: rgba(255,255,255,0.65); font-weight: 500; }

  /* 하단 태그 */
  .tag-row {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .tag {
    border: 1px solid rgba(255,255,255,0.12);
    padding: 5px 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11px; color: rgba(255,255,255,0.45);
    letter-spacing: 0.5px;
  }
  .tag.red { border-color: rgba(215,0,17,0.4); color: rgba(215,0,17,0.8); }

  /* 우측 패널 */
  .right {
    padding: 44px 36px 44px 36px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: rgba(255,255,255,0.02);
  }

  .panel-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px; color: rgba(255,255,255,0.25);
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 20px;
  }

  /* 가로 바 차트 (장식) */
  .chart-section { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .bar-row { display: flex; flex-direction: column; gap: 5px; }
  .bar-label-row { display: flex; justify-content: space-between; }
  .bar-label {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 11px; color: rgba(255,255,255,0.45);
  }
  .bar-val {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: rgba(255,255,255,0.35);
  }
  .bar-track {
    height: 5px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden;
  }
  .bar-fill {
    height: 100%; border-radius: 2px;
    background: rgba(215,0,17,0.6);
  }

  /* 수직 구분선 + 핵심 수치 */
  .divider { height: 1px; background: rgba(255,255,255,0.07); margin: 18px 0; }

  .kpi-row { display: flex; justify-content: space-between; }
  .kpi-item { text-align: center; }
  .kpi-num {
    font-family: 'DM Mono', monospace;
    font-size: 22px; font-weight: 500; color: #fff;
    letter-spacing: -1px;
  }
  .kpi-num.red { color: #D70011; }
  .kpi-lbl {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 10px; color: rgba(255,255,255,0.3);
    margin-top: 3px;
  }

  .bottom-url {
    font-family: 'DM Mono', monospace;
    font-size: 10px; color: rgba(255,255,255,0.15);
    letter-spacing: 0.5px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid-lines"></div>

<div class="container">
  <div class="left">
    <div class="top-meta">
      <div class="badge-red">Safety Analytics</div>
      <div class="badge-version">v9.0</div>
      <div class="date-meta">2026.04</div>
    </div>

    <div>
      <div class="main-title">
        근로자 사고<br/>
        통합 <span class="accent">분석</span><br/>
        대시보드
      </div>
      <div class="subtitle">
        사고유형 · 발생장소 · 시간대 · 인적요인<br/>
        <strong>다각도 데이터 기반 안전 인사이트</strong>
      </div>
    </div>

    <div class="tag-row">
      <div class="tag red">㈜아성다이소 안전보건팀</div>
      <div class="tag">사고유형 분석</div>
      <div class="tag">시간대별 추이</div>
      <div class="tag">발생장소 분포</div>
    </div>
  </div>

  <div class="right">
    <div>
      <div class="panel-label">사고 유형 분포</div>
      <div class="chart-section">
        <div class="bar-row">
          <div class="bar-label-row"><span class="bar-label">넘어짐</span><span class="bar-val">32%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:72%"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label-row"><span class="bar-label">끼임</span><span class="bar-val">18%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:41%;background:rgba(215,0,17,0.4)"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label-row"><span class="bar-label">떨어짐</span><span class="bar-val">14%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:32%;background:rgba(215,0,17,0.3)"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label-row"><span class="bar-label">부딪힘</span><span class="bar-val">11%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:25%;background:rgba(215,0,17,0.2)"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label-row"><span class="bar-label">기타</span><span class="bar-val">25%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:56%;background:rgba(255,255,255,0.1)"></div></div>
        </div>
      </div>
    </div>

    <div>
      <div class="divider"></div>
      <div class="kpi-row">
        <div class="kpi-item">
          <div class="kpi-num red">다각도</div>
          <div class="kpi-lbl">분석 관점</div>
        </div>
        <div class="kpi-item">
          <div class="kpi-num">실시간</div>
          <div class="kpi-lbl">데이터 반영</div>
        </div>
        <div class="kpi-item">
          <div class="kpi-num">v9</div>
          <div class="kpi-lbl">최신 버전</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="bottom-url">gerrardbak08.github.io/sagobunsuk-dashboard</div>
    </div>
  </div>
</div>
</body>
</html>
